# L6 리스크 게이트 v1 — 사람이 고정 (D9), 바꾸려면 새 버전 파일.
# 아키텍처 L6: "하룻밤 갭은 손절로 못 막으므로 비중으로 통제(D5). 1건 최대 비중, 같은 날 합산 한도, 체결 가능성(상한가·거래대금)".
# 문서에 숫자가 없어서 2026-10-31 에 PM 대행(Claude)이 제안한 값이다 (모의투자). 결과를 보고 고치지 않는다.
version: risk_v1
paper_capital_krw: 100000000      # 가상 운용금 1억원 (비중 → 진입 금액 환산용)
weight_per_trade: 0.10            # 1건당 목표 비중 (운용금 대비)
max_weight_per_day: 0.20          # 같은 날 기록하는 신규 진입 비중 합계 상한
min_weight: 0.01                  # 거래대금 한도로 줄인 비중이 이보다 작으면 진입하지 않는다
max_participation: 0.01           # 진입 금액 ≤ 전 거래일 거래대금(종가×거래량)의 1%
limit_up_pct: 29.0                # 전 거래일 종가가 그 전일 대비 이 % 이상이면 상한가 마감으로 보고 시가 진입 금지 (코스닥 ±30%)
