# 전략 B (흥행 실패주 반등) 규칙 v1 — 사람이 고정 (D9), 바꾸려면 새 버전 파일.
# 팀 문서(아키텍처 L5, 아이디에이션)에는 '경쟁률 하위군 + 시장·섹터 저점 대비 x% 반등', 청산 '기간·목표 미정' 까지만 있었다.
# 아래 숫자는 문서에 없어서 2026-10-31 에 PM 대행(Claude)이 제안해 사용자가 위임한 값이다. 결과를 보기 전에 고정했다.
# 쓸 수 있는 데이터(일봉·코스닥 지수·수요예측 경쟁률)만으로 만든 규칙이라 섹터 지수 조건은 없다.
version: B_v1
entry:
  min_days_since_listing: 20      # 상장 후 거래일 (너무 이른 변동은 제외)
  max_days_since_listing: 120
  max_demand_ratio: 300           # 기관 수요예측 경쟁률 이하 = '흥행 실패' (확인된 값만; 미확인이면 관망)
  max_close_vs_offer: 1.0         # 최근 종가 ≤ 공모가 × 이 값 = 눌린 상태
  market_lookback_days: 60        # 코스닥 종가가 이 기간 최저 종가보다
  market_rebound_pct: 8.0         # 이만큼 이상 올라와 있으면 '시장 회복'
  enter_at: next_open             # 신호 다음 거래일 시가 매수
exit:
  hold_days: 40                   # 매수일 이후 40거래일째 시가에 매도
  stop_loss_pct: 15.0             # 종가가 매수가 대비 -15% 이하면 다음 거래일 시가에 매도
  take_profit_pct: 30.0           # 종가가 매수가 대비 +30% 이상이면 다음 거래일 시가에 매도
once_per_ipo: true                # 한 종목당 한 번만 진입
