# 전략 C (매물 소화 후 회복) 규칙 v1 — 사람이 고정 (D9), 바꾸려면 새 버전 파일.
# 팀 문서에는 '해제일 경과 + 실제 매도 확인 + 가격 안정', 청산 '미정' 까지만 있었다.
# 아래 숫자는 문서에 없어서 2026-10-31 에 PM 대행(Claude)이 제안해 사용자가 위임한 값이다. 결과를 보기 전에 고정했다.
# 예탁결제원 해제 일정과 투자자별 매매는 수집하지 못해서 대용 지표를 쓴다:
#   해제일 = 상장일 + 확약 기간(1·3·6개월) — 발행조건확정 공시의 확약 신청 수량이 있는 기간만 (최대주주 등 다른 의무보유는 모름)
#   실제 매도 확인 = 해제일 포함 5거래일 중 최대 거래량이 직전 20거래일 중앙값의 몇 배 이상인가 (투자자 구분 없음)
version: C_v1
entry:
  periods_months: [1, 3, 6]       # 15일 확약은 상장 직후 노이즈라 제외
  min_unlock_pct: 5.0             # 해제 확약 수량 ÷ 상장 주식수(%) 가 이 값 이상인 해제일만 본다
  window_days: 5                  # 해제일부터 이 거래일 수만큼 관찰 (해제일 = 1일째)
  volume_spike_x: 3.0             # 관찰 기간 최대 거래량 ≥ 직전 20거래일 중앙값 × 이 값 (매도 물량이 나왔다는 대용)
  volume_base_days: 20
  stable_last_days: 3             # 관찰 마지막 이 거래일의 종가 변동폭이
  stable_range_pct: 6.0           # (최고 종가 ÷ 최저 종가 − 1) 이 값 이하면 '가격 안정'
  min_close_vs_pre_unlock: 0.8    # 관찰 마지막 종가 ≥ 해제 전날 종가 × 이 값 (붕괴 중이 아님)
  enter_at: next_open             # 관찰이 끝난 다음 거래일 시가 매수
exit:
  hold_days: 30
  stop_loss_pct: 12.0
  take_profit_pct: 25.0
once_per_event: true              # 해제일(기간)마다 한 번
